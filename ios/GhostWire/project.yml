name: GhostWire
options:
  bundleIdPrefix: com.ghostwire
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_PREVIEWS: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  GhostWire:
    type: application
    platform: iOS
    sources:
      - path: GhostWire
    resources:
      - path: GhostWire/Resources/Assets.xcassets
    info:
      path: GhostWire/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: "GhostWire reads your current Wi-Fi network name to label diagnostics results. Your location is never stored or transmitted."
        NSLocalNetworkUsageDescription: "GhostWire probes hosts on your local network (gateway, LAN devices) to run ping, traceroute and port-scan diagnostics you request."
        NSBonjourServices:
          - _dns-sd._udp
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: GhostWire/GhostWire.entitlements
      properties:
        com.apple.developer.networking.wifi-info: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ghostwire.app
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES

schemes:
  GhostWire:
    build:
      targets:
        GhostWire: all
    run:
      config: Debug
    archive:
      config: Release
