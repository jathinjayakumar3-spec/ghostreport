<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060D12">
</head>
<body>
<title>Ghost Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&family=Azeret+Mono:wght@400;500;600&display=swap">
<style>
/* ==========================================================
   Palette: fibre-splice — midnight ground, cyan signal,
   sodium amber for value, rose for anything unread.
   ========================================================== */
:root{
  --cy:#2BB8CE; --cy-lift:#37D2E8; --cy-deep:#0E6E80;
  --am:#D98324; --am-lift:#EFA044;
  --ro:#D2436B; --ro-lift:#E4658A;
  --gr:#2E9469; --gr-lift:#43B383;

  --bg0:#EEF2F5; --bg1:#E3E9EE;
  --glass:rgba(255,255,255,.72);
  --glass-2:rgba(255,255,255,.55);
  --glass-brd:rgba(15,32,42,.10);
  --glass-hi:rgba(255,255,255,.9);
  --ink:#0D1B22; --ink-2:#3A4C56; --muted:#657985; --faint:#93A6B2;
  --line:rgba(15,32,42,.10); --line-2:rgba(15,32,42,.18);
  --sheet:#FFFFFF;
  --blur:16px;
  --sh1:0 1px 2px rgba(9,24,32,.06);
  --sh2:0 10px 30px -8px rgba(9,24,32,.16), 0 2px 6px rgba(9,24,32,.06);
  --sh3:0 30px 70px -18px rgba(9,24,32,.35), 0 4px 14px rgba(9,24,32,.10);
  --r1:8px; --r2:14px; --r3:22px;
  --rail:246px;
  --fd:"Sora","Helvetica Neue",Arial,sans-serif;
  --fb:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --fm:"Azeret Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg0:#060D12; --bg1:#0A151C;
    --glass:rgba(19,34,44,.62);
    --glass-2:rgba(19,34,44,.40);
    --glass-brd:rgba(150,200,220,.13);
    --glass-hi:rgba(150,215,235,.20);
    --ink:#E6F0F5; --ink-2:#B7CAD5; --muted:#7E96A4; --faint:#587284;
    --line:rgba(150,200,220,.12); --line-2:rgba(150,200,220,.22);
    --sheet:#101E27;
    --cy:#37D2E8; --cy-lift:#63E1F2; --cy-deep:#8DECF8;
    --am:#EFA044; --am-lift:#F7BC72;
    --ro:#E4658A; --ro-lift:#F088A7;
    --gr:#43B383; --gr-lift:#63CB9E;
    --sh1:0 1px 2px rgba(0,0,0,.5);
    --sh2:0 10px 30px -8px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.4);
    --sh3:0 30px 70px -18px rgba(0,0,0,.8), 0 4px 14px rgba(0,0,0,.5);
  }
}
:root[data-theme="Dark"]{
  --bg0:#060D12; --bg1:#0A151C;
  --glass:rgba(19,34,44,.62);
  --glass-2:rgba(19,34,44,.40);
  --glass-brd:rgba(150,200,220,.13);
  --glass-hi:rgba(150,215,235,.20);
  --ink:#E6F0F5; --ink-2:#B7CAD5; --muted:#7E96A4; --faint:#587284;
  --line:rgba(150,200,220,.12); --line-2:rgba(150,200,220,.22);
  --sheet:#101E27;
  --cy:#37D2E8; --cy-lift:#63E1F2; --cy-deep:#8DECF8;
  --am:#EFA044; --am-lift:#F7BC72;
  --ro:#E4658A; --ro-lift:#F088A7;
  --gr:#43B383; --gr-lift:#63CB9E;
  --sh1:0 1px 2px rgba(0,0,0,.5);
  --sh2:0 10px 30px -8px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.4);
  --sh3:0 30px 70px -18px rgba(0,0,0,.8), 0 4px 14px rgba(0,0,0,.5);
}

*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;background:var(--bg0);color:var(--ink);
  font-family:var(--fb);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overflow-x:hidden;
}
#aurora{position:fixed;inset:0;z-index:0;pointer-events:none;}
h1,h2,h3,h4{font-family:var(--fd);margin:0;line-height:1.14;letter-spacing:-.02em;text-wrap:balance;}
button,input,select,textarea{font:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px;border-radius:6px;}
::selection{background:var(--cy);color:var(--bg0);}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.hidden{display:none !important;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

/* ---------- glass primitives ---------- */
.g{
  background:var(--glass);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(150%);
  backdrop-filter:blur(var(--blur)) saturate(150%);
  border:1px solid var(--glass-brd);
  border-radius:var(--r3);
  box-shadow:var(--sh2);
  position:relative;
}
.g::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(160deg,var(--glass-hi),transparent 38%);
  opacity:.55;
}
.g>*{position:relative;}

/* ---------- entrance motion ---------- */
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985);}to{opacity:1;transform:none;}}
.anim{animation:rise .5s var(--ease) both;}
@keyframes pulseDot{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.5);opacity:.45;}}
@keyframes sweep{from{background-position:-160% 0;}to{background-position:260% 0;}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
}

/* ---------- controls ---------- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0;}
.lbl{font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);}
.inp,.sel,.ta{
  width:100%;background:var(--glass-2);border:1px solid var(--line-2);border-radius:var(--r1);
  padding:10px 12px;font-size:14.5px;color:var(--ink);
  transition:border-color .16s var(--ease),box-shadow .16s var(--ease),background .16s;
}
.ta{resize:vertical;min-height:104px;line-height:1.6;font-family:var(--fb);}
.inp:hover,.sel:hover,.ta:hover{border-color:var(--muted);}
.inp:focus,.sel:focus,.ta:focus{outline:none;border-color:var(--cy);box-shadow:0 0 0 3px color-mix(in srgb,var(--cy) 22%,transparent);background:var(--glass);}
.inp::placeholder,.ta::placeholder{color:var(--faint);}
.inp[readonly],.inp:disabled{background:color-mix(in srgb,var(--muted) 12%,transparent);color:var(--muted);cursor:not-allowed;border-style:dashed;}
.inp.m,.ta.m{font-family:var(--fm);font-variant-numeric:tabular-nums;}
.sel{appearance:none;cursor:pointer;padding-right:34px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;}
.hint{font-size:12.5px;color:var(--muted);line-height:1.55;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--line-2);border-radius:var(--r1);padding:10px 16px;
  font-size:14px;font-weight:600;cursor:pointer;background:var(--glass-2);color:var(--ink);
  transition:transform .16s var(--spring),background .16s,border-color .16s,box-shadow .16s;white-space:nowrap;}
.btn:hover{background:var(--glass);border-color:var(--muted);transform:translateY(-1px);}
.btn:active{transform:translateY(0) scale(.985);}
.btn.p{background:linear-gradient(135deg,var(--cy),var(--cy-deep));border-color:transparent;color:#04161B;
  box-shadow:0 6px 18px -6px color-mix(in srgb,var(--cy) 70%,transparent);}
.btn.p:hover{background:linear-gradient(135deg,var(--cy-lift),var(--cy));}
:root[data-theme="dark"] .btn.p{color:#04161B;}
.btn.a{background:linear-gradient(135deg,var(--am-lift),var(--am));border-color:transparent;color:#231103;
  box-shadow:0 6px 18px -6px color-mix(in srgb,var(--am) 70%,transparent);}
.btn.d{background:transparent;border-color:var(--line-2);color:var(--ro);}
.btn.d:hover{background:color-mix(in srgb,var(--ro) 14%,transparent);border-color:var(--ro);}
.btn.s{padding:7px 12px;font-size:13px;}
.btn.i{padding:0;width:32px;height:32px;}
.btn[disabled]{opacity:.42;pointer-events:none;}
.btn svg{width:16px;height:16px;stroke-width:1.9;flex:none;}

.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:100px;
  font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;
  border:1px solid transparent;}
.chip.cy{background:color-mix(in srgb,var(--cy) 16%,transparent);color:var(--cy-deep);border-color:color-mix(in srgb,var(--cy) 34%,transparent);}
.chip.am{background:color-mix(in srgb,var(--am) 16%,transparent);color:var(--am);border-color:color-mix(in srgb,var(--am) 34%,transparent);}
.chip.ro{background:color-mix(in srgb,var(--ro) 16%,transparent);color:var(--ro);border-color:color-mix(in srgb,var(--ro) 34%,transparent);}
.chip.gr{background:color-mix(in srgb,var(--gr) 16%,transparent);color:var(--gr);border-color:color-mix(in srgb,var(--gr) 34%,transparent);}
.chip.mu{background:color-mix(in srgb,var(--muted) 14%,transparent);color:var(--muted);border-color:var(--line-2);}
:root[data-theme="dark"] .chip.cy{color:var(--cy);}

/* ---------- login ---------- */
#gate{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:22px;overflow:auto;}
.gcard{width:100%;max-width:412px;padding:36px 32px 28px;border-radius:26px;animation:rise .7s var(--ease) both;}
.glogo{display:flex;align-items:center;gap:12px;margin-bottom:26px;}
.glogo .mk{width:44px;height:44px;border-radius:13px;flex:none;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--cy),var(--cy-deep));color:#04161B;box-shadow:0 8px 22px -8px var(--cy);}
.glogo .mk svg{width:23px;height:23px;stroke-width:2.1;}
.glogo b{font-family:var(--fd);font-size:20px;font-weight:800;display:block;line-height:1.1;}
.glogo span{font-family:var(--fm);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);}
.gcard h2{font-size:25px;font-weight:700;margin-bottom:6px;}
.gcard .gs{color:var(--muted);font-size:14px;margin:0 0 24px;}
.gform{display:flex;flex-direction:column;gap:14px;}
.gcard .btn.p{width:100%;padding:13px;font-size:15px;margin-top:4px;}
.gerr{background:color-mix(in srgb,var(--ro) 16%,transparent);border:1px solid color-mix(in srgb,var(--ro) 40%,transparent);
  color:var(--ro);padding:10px 13px;border-radius:var(--r1);font-size:13.5px;animation:rise .3s var(--ease) both;}
.groles{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line);}
.grole{padding:8px 4px;border-radius:var(--r1);border:1px solid var(--line-2);background:transparent;cursor:pointer;
  font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);
  transition:all .16s var(--ease);}
.grole:hover{border-color:var(--cy);color:var(--cy);transform:translateY(-2px);}
.gfoot{margin-top:16px;font-size:11.5px;color:var(--faint);text-align:center;line-height:1.6;}
.gmode{display:inline-flex;align-items:center;gap:6px;font-family:var(--fm);font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.dot{width:6px;height:6px;border-radius:50%;background:var(--gr);display:inline-block;animation:pulseDot 2.6s infinite;}
.dot.off{background:var(--am);}

/* ---------- shell ---------- */
#app{display:none;position:relative;z-index:1;min-height:100vh;}
#app.on{display:block;}
.rail{position:fixed;left:14px;top:14px;bottom:14px;width:var(--rail);z-index:40;
  display:flex;flex-direction:column;padding:20px 14px;gap:4px;border-radius:var(--r3);overflow:auto;}
.rbrand{display:flex;align-items:center;gap:11px;padding:2px 8px 20px;}
.rbrand .mk{width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--cy),var(--cy-deep));color:#04161B;}
.rbrand .mk svg{width:18px;height:18px;stroke-width:2.1;}
.rbrand b{font-family:var(--fd);font-size:15.5px;font-weight:800;display:block;line-height:1.1;}
.rbrand span{font-family:var(--fm);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
.rsec{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
  padding:14px 10px 6px;}
.nv{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:none;background:none;cursor:pointer;
  padding:9px 11px;border-radius:var(--r1);color:var(--ink-2);font-size:14px;font-weight:500;
  transition:background .16s,color .16s,transform .16s var(--spring);}
.nv svg{width:17px;height:17px;stroke-width:1.85;flex:none;}
.nv:hover{background:var(--glass-2);color:var(--ink);transform:translateX(2px);}
.nv.on{background:linear-gradient(100deg,color-mix(in srgb,var(--cy) 22%,transparent),transparent);
  color:var(--cy-deep);font-weight:700;box-shadow:inset 2px 0 0 var(--cy);}
:root[data-theme="dark"] .nv.on{color:var(--cy);}
.nv .bdg{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:100px;display:grid;place-items:center;
  background:var(--ro);color:#fff;font-family:var(--fm);font-size:10.5px;font-weight:600;}
.rfoot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px;}
.whoami{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r1);background:var(--glass-2);margin-bottom:6px;}
.whoami .av{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;
  font-family:var(--fd);font-weight:700;font-size:13px;color:#04161B;background:linear-gradient(140deg,var(--cy),var(--cy-deep));}
.whoami b{display:block;font-size:13px;line-height:1.2;}
.whoami span{font-family:var(--fm);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}

.main{margin-left:calc(var(--rail) + 28px);padding:20px 22px 90px;max-width:1320px;}
.tbar{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
.tbar h1{font-size:27px;font-weight:700;}
.tbar .ts{color:var(--muted);font-size:13.5px;margin-top:5px;}
.tbar .tacts{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap;}
.tabbar{display:none;}

@media (max-width:1000px){
  .rail{display:none;}
  .main{margin-left:0;padding:16px 14px 96px;}
  .tbar h1{font-size:22px;}
  .tabbar{display:grid;position:fixed;left:10px;right:10px;bottom:10px;z-index:45;
    border-radius:20px;padding:7px;gap:3px;}
  .tb{display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:none;cursor:pointer;
    padding:7px 2px;border-radius:12px;color:var(--muted);font-size:9.5px;font-weight:700;position:relative;
    transition:color .16s,background .16s;}
  .tb svg{width:19px;height:19px;stroke-width:1.9;}
  .tb.on{color:var(--cy);background:color-mix(in srgb,var(--cy) 14%,transparent);}
  .tb .bdg{position:absolute;top:2px;right:calc(50% - 20px);min-width:16px;height:16px;padding:0 4px;border-radius:100px;
    background:var(--ro);color:#fff;font-family:var(--fm);font-size:9px;display:grid;place-items:center;}
}

/* ---------- pipeline rail ---------- */
.pipe{display:flex;gap:0;padding:16px 18px;margin-bottom:18px;border-radius:var(--r3);overflow-x:auto;}
.pst{flex:1;min-width:118px;position:relative;padding:0 10px;cursor:pointer;background:none;border:none;text-align:left;
  transition:transform .2s var(--spring);}
.pst:hover{transform:translateY(-2px);}
.pst::after{content:"";position:absolute;left:calc(100% - 4px);top:15px;width:8px;height:8px;
  border-top:1.6px solid var(--line-2);border-right:1.6px solid var(--line-2);transform:rotate(45deg);}
.pst:last-child::after{display:none;}
.pst .pn{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;margin-bottom:9px;
  font-family:var(--fm);font-size:13px;font-weight:600;
  background:var(--glass-2);border:1px solid var(--line-2);color:var(--muted);
  transition:all .3s var(--spring);}
.pst.hot .pn{background:linear-gradient(140deg,var(--cy),var(--cy-deep));color:#04161B;border-color:transparent;
  box-shadow:0 6px 18px -6px var(--cy);transform:scale(1.06);}
.pst .pl{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);line-height:1.35;}
.pst.hot .pl{color:var(--ink);}
.pst .pw{font-size:10.5px;color:var(--faint);margin-top:3px;}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:13px;margin-bottom:18px;}
.st{padding:16px 18px;border-radius:var(--r2);}
.st .k{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.st .v{font-family:var(--fm);font-size:28px;font-weight:600;letter-spacing:-.035em;margin-top:6px;font-variant-numeric:tabular-nums;}
.st .sub{font-size:11.5px;color:var(--faint);margin-top:3px;}
.st.cy .v{color:var(--cy-deep);} :root[data-theme="dark"] .st.cy .v{color:var(--cy);}
.st.am .v{color:var(--am);}
.st.ro .v{color:var(--ro);}
.st.gr .v{color:var(--gr);}

/* ---------- panels / lists ---------- */
.pnl{padding:0;border-radius:var(--r3);margin-bottom:18px;overflow:hidden;}
.ph{display:flex;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.ph .n{font-family:var(--fm);font-size:11px;font-weight:600;color:var(--cy-deep);letter-spacing:.08em;}
:root[data-theme="dark"] .ph .n{color:var(--cy);}
.ph h3{font-size:15px;font-weight:700;flex:1;min-width:100px;}
.pb{padding:20px;}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px;}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:15px;}

.rowlist{display:flex;flex-direction:column;gap:10px;}
.row{padding:15px 17px;border-radius:var(--r2);display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;
  cursor:pointer;transition:transform .2s var(--spring),box-shadow .2s,border-color .2s;}
.row:hover{transform:translateY(-2px);box-shadow:var(--sh3);border-color:color-mix(in srgb,var(--cy) 45%,transparent);}
.row .rf{font-family:var(--fm);font-size:11px;color:var(--cy-deep);letter-spacing:.05em;}
:root[data-theme="dark"] .row .rf{color:var(--cy);}
.row .rt{font-family:var(--fd);font-size:16.5px;font-weight:700;margin:3px 0 4px;}
.row .rm{font-size:12.5px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;}
.row .rr{display:flex;flex-direction:column;align-items:flex-end;gap:7px;}
.row .amt{font-family:var(--fm);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;}
.row .amt small{font-size:10px;color:var(--muted);margin-right:4px;}
.row.unread{border-color:color-mix(in srgb,var(--ro) 50%,transparent);
  background:linear-gradient(100deg,color-mix(in srgb,var(--ro) 10%,transparent),var(--glass));}
.row.unread .rf{color:var(--ro);}
.unreadDot{width:8px;height:8px;border-radius:50%;background:var(--ro);animation:pulseDot 2s infinite;flex:none;}

.empty{text-align:center;padding:56px 22px;}
.empty svg{width:38px;height:38px;stroke-width:1.3;color:var(--faint);margin-bottom:14px;}
.empty h3{font-size:17px;margin-bottom:7px;}
.empty p{margin:0 auto 20px;max-width:46ch;font-size:14px;color:var(--muted);line-height:1.6;}

/* ---------- tables ---------- */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table.t{width:100%;border-collapse:collapse;}
table.t th{text-align:left;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  padding:10px 9px;border-bottom:1px solid var(--line-2);white-space:nowrap;}
table.t td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13.5px;}
table.t tr:last-child td{border-bottom:none;}
table.t td.r{text-align:right;font-family:var(--fm);font-variant-numeric:tabular-nums;white-space:nowrap;}

table.t .inp,table.t .sel{padding:7px 9px;font-size:13px;}
table.items{min-width:820px;}
.c-mod{min-width:150px;} .c-desc{min-width:220px;} .c-unit{width:96px;} .c-qty{width:74px;} .c-rate{width:104px;}
.amtc{font-family:var(--fm);font-variant-numeric:tabular-nums;font-size:13.5px;text-align:right;width:112px;font-weight:500;}

/* ---------- totals ---------- */
.tots{display:grid;grid-template-columns:1fr minmax(280px,372px);gap:18px;align-items:start;}
@media (max-width:820px){.tots{grid-template-columns:1fr;}}
.tbox{border-radius:var(--r3);overflow:hidden;position:sticky;top:16px;}
.tr{display:flex;justify-content:space-between;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line);font-size:14px;}
.tr span{color:var(--ink-2);}
.tr b{font-family:var(--fm);font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap;}
.tr.s{background:var(--glass-2);}
.tr.s span,.tr.s b{font-weight:700;color:var(--ink);}
.tr.g{background:linear-gradient(120deg,var(--cy-deep),color-mix(in srgb,var(--cy-deep) 60%,#000));
  border-bottom:none;padding:17px 18px;align-items:center;}
:root[data-theme="dark"] .tr.g{background:linear-gradient(120deg,#0B2C36,#071A21);}
.tr.g span{color:rgba(255,255,255,.68);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;}
.tr.g b{font-size:23px;font-weight:600;color:var(--am-lift);}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(4,12,17,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  display:grid;place-items:center;padding:16px;animation:rise .25s var(--ease) both;}
.mdl{width:100%;max-width:640px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;border-radius:var(--r3);
  background:var(--sheet);border:1px solid var(--glass-brd);box-shadow:var(--sh3);}
.mdl.w{max-width:940px;}
.mh{padding:17px 21px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;}
.mh h3{font-size:17px;font-weight:700;flex:1;}
.mb{padding:21px;overflow-y:auto;}
.mf{padding:15px 21px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;
  background:var(--glass-2);}

.pickrow{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r1);
  cursor:pointer;margin-bottom:7px;transition:all .16s var(--ease);}
.pickrow:hover{border-color:var(--cy);background:color-mix(in srgb,var(--cy) 10%,transparent);transform:translateX(3px);}
.pickrow .pi{flex:1;min-width:0;}
.pickrow .pm{font-weight:600;font-size:14px;}
.pickrow .pd{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;
  gap:8px;align-items:center;pointer-events:none;}
.tst{padding:12px 20px;border-radius:100px;font-size:13.5px;font-weight:600;box-shadow:var(--sh3);max-width:92vw;
  background:var(--sheet);border:1px solid var(--line-2);animation:rise .3s var(--spring) both;}
.tst.ok{border-color:var(--gr);color:var(--gr);}
.tst.er{border-color:var(--ro);color:var(--ro);}

.pillrow{display:flex;gap:7px;flex-wrap:wrap;}
.pill{padding:6px 13px;border-radius:100px;border:1px solid var(--line-2);background:var(--glass-2);cursor:pointer;
  font-size:12.5px;font-weight:600;color:var(--ink-2);transition:all .16s var(--ease);}
.pill:hover{border-color:var(--cy);transform:translateY(-1px);}
.pill.on{background:linear-gradient(135deg,var(--cy),var(--cy-deep));border-color:transparent;color:#04161B;}
.divider{height:1px;background:var(--line);margin:20px 0;}
.note{padding:13px 16px;border-radius:var(--r2);font-size:13px;line-height:1.6;border:1px solid;}
.note.cy{background:color-mix(in srgb,var(--cy) 10%,transparent);border-color:color-mix(in srgb,var(--cy) 32%,transparent);}
.note.am{background:color-mix(in srgb,var(--am) 10%,transparent);border-color:color-mix(in srgb,var(--am) 32%,transparent);}
.note.ro{background:color-mix(in srgb,var(--ro) 10%,transparent);border-color:color-mix(in srgb,var(--ro) 32%,transparent);}

.sh-tot .r.s{background:#F1F5F7;font-weight:700;}

@media print{

function animateNum(el,to){

  }

(function aurora(){
  var cv=$("#aurora"); if(!cv) return;
  var ctx=cv.getContext("2d"),W=0,H=0,dpr=Math.min(window.devicePixelRatio||1,1.6),blobs=[],raf=null;
  var reduced=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function hues(){
    var dark=isDark();
    return dark
      ? [[55,210,232,.20],[14,110,128,.24],[239,160,68,.10],[212,67,107,.09]]
      : [[43,184,206,.30],[14,110,128,.17],[217,131,36,.16],[210,67,107,.11]];
  }
  function build(){
    W=window.innerWidth;H=window.innerHeight;
    cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+"px";cv.style.height=H+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
    var hs=hues();blobs=[];
    for(var i=0;i<hs.length;i++){
      blobs.push({c:hs[i],
        x:Math.random()*W,y:Math.random()*H,
        r:Math.max(W,H)*(0.34+Math.random()*0.30),
        ax:(Math.random()*.5+.25)*W*.34, ay:(Math.random()*.5+.25)*H*.34,
        sx:0.000045+Math.random()*0.00007, sy:0.000038+Math.random()*0.00006,
        px:Math.random()*6.28, py:Math.random()*6.28});
    }
  }
  function draw(t){
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<blobs.length;i++){
      var b=blobs[i];
      var x=b.x+Math.sin(t*b.sx+b.px)*b.ax;
      var y=b.y+Math.cos(t*b.sy+b.py)*b.ay;
      var g=ctx.createRadialGradient(x,y,0,x,y,b.r);
      g.addColorStop(0,"rgba("+b.c[0]+","+b.c[1]+","+b.c[2]+","+b.c[3]+")");
      g.addColorStop(1,"rgba("+b.c[0]+","+b.c[1]+","+b.c[2]+",0)");
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,b.r,0,6.2832);ctx.fill();
    }
    if(!reduced) raf=requestAnimationFrame(draw);
  }

  window.addEventListener("resize",function(){clearTimeout(to);to=setTimeout(start,200);});
})();

        }catch(e){ rej(e); }
      },40);
    });
  }
  return fetch(L.endpoint,{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({action:action,token:TOKEN,payload:payload||{}}),
    redirect:"follow"
  }).then(function(r){return r.text();}).then(function(t){
    var j; try{ j=JSON.parse(t); }catch(e){ throw new Error("The data source replied with something unreadable. Check the deployment URL and that access is set to Anyone."); }

function plural(w){
  if(!w) return w;
  if(/^[A-Z0-9\-\/]+$/.test(w)) return w;
  if(/\d/.test(w)) return w;
  if(UNCOUNT.test(w)) return w;
  if(/s$/i.test(w)) return w;
  if(/(x|z|ch|sh)$/i.test(w)) return w+"es";
  if(/[^aeiou]y$/i.test(w)) return w.slice(0,-1)+"ies";
  return w+"s";
}
function pluraliseQty(s){
  return s.replace(/\b(\d+)\s+nos\.\s+([^.,;]+)/g,function(m,q,obj){
    obj=obj.replace(/\s+$/,"");
    if(Number(q)<=1) return q+" no. "+obj;
    var parts=obj.split(/\s+/);
    parts[parts.length-1]=plural(parts[parts.length-1]);
    return q+" nos. "+parts.join(" ");
  });
}
function stripLead(s){return String(s).replace(/^[\s\-–—•*·]+/,"").replace(/^\d+[.)]\s*/,"");}
function normalise(s){
  s=stripLead(s).trim().replace(/\s+/g," ");
  s=s.replace(/(\d+)\s*-?\s*port\b/gi,"$1-port");
  s=s.replace(/(\d+)\s*nos?\.?(?=\s)/gi,"$1 nos.");
  s=s.replace(/nos\.+/gi,"nos.");
  s=s.replace(/(\d+)\s*point\b/gi,"$1 points");
  s=s.replace(/(\d+)\s*u\b(?=\s|$)/gi,"$1U");
  s=s.replace(/(\d+)\s*k?va\b/gi,"$1kVA");
  s=s.replace(/(\d+)\s*(tb|gb|mb)\b/gi,function(m,d,u){return d+u.toUpperCase();});
  TERMS.forEach(function(t){s=s.replace(t[0],t[1]);});
  return s.replace(/\s+/g," ").trim();
}
function clean(x){
  return String(x||"").trim().replace(/^(of|for|to|the|a|an|and|&|in|on|at|all)\s+/i,"")
    .replace(/\s+(of|for|to|and|&)$/i,"").replace(/\s+/g," ").trim();

function oneBullet(frag){
  var full=normalise(frag);
  if(!full||full.length<2) return "";
  full=full.replace(/[.;]+$/,"");
  var out=null;
  for(var i=0;i<RULES.length;i++){
    var r=RULES[i];
    if(r.re.test(full)){
      var o=clean(full.replace(r.re,""));
      out=r.f(o,full);
      break;
    }
  }
  if(!out){
    var pts=full.match(/(\d+)\s*points/i);
    if(CABLE.test(full)&&pts){
      var ct=(full.match(CABLE)||["Cat6"])[0];
      out="Supply and install "+ct+" cabling for "+pts[1]+" network points, complete with faceplates, keystone jacks and patch panel terminations.";
    }
    else if(DEVICE.test(full)||CABLE.test(full)) out="Supply and install "+full+".";
    else out="Carry out "+full+".";
  }
  out=pluraliseQty(out).replace(/\s+/g," ").replace(/\s+([.,])/g,"$1").replace(/\.{2,}/g,".").trim();
  out=out.charAt(0).toUpperCase()+out.slice(1);
  if(!/[.!?]$/.test(out)) out+=".";
  return out;
}
function rewriteScope(raw){
  if(!raw||!String(raw).trim()) return "";
  var frags=String(raw).split(/[\n;]+|,(?![^()]*\))/).map(function(x){return x.trim();}).filter(Boolean);
  var seen={},out=[];
  frags.forEach(function(f){
    var b=oneBullet(f);
    if(b&&!seen[b.toLowerCase()]){seen[b.toLowerCase()]=1;out.push(b);}
  });
  return out.join("\n");
}

function calc(b,items){
  items=items||[];
  var materials=0;
  items.forEach(function(it){materials+=n(it.qty)*n(it.rate);});
  var prof=(b.profMode==="pct")?materials*n(b.profValue)/100:n(b.profValue);
  var mp=[];try{mp=JSON.parse(b.manpowerJson||"[]");}catch(e){mp=[];}
  var mpAuto=0,manDays=0;
  mp.forEach(function(m){mpAuto+=n(m.count)*n(m.days)*n(m.rate);manDays+=n(m.count)*n(m.days);});
  var manpower=(b.mpMode==="fixed")?n(b.mpValue):mpAuto;
  var subtotal=materials+prof+manpower;
  var disc=(b.discMode==="pct")?subtotal*n(b.discValue)/100:n(b.discValue);
  if(disc>subtotal) disc=subtotal;
  var net=subtotal-disc;
  var vatOn=String(b.vatEnabled)==="1"||b.vatEnabled===true||b.vatEnabled==="TRUE";
  var vat=vatOn?net*n(b.vatPercent)/100:0;
  return {materials:materials,prof:prof,manpower:manpower,mp:mp,manDays:manDays,
    subtotal:subtotal,disc:disc,net:net,vat:vat,vatOn:vatOn,grand:net+vat,count:items.length};
}

    h+='<button class="pst'+(c>0?" hot":"")+'" data-stage="'+s.k+'">'+
      '<div class="pn">'+c+'</div><div class="pl">'+esc(s.l)+'</div><div class="pw">'+esc(s.w)+"</div></button>";
  });
  return h+"</div>";
}
function runCounters(){
  $$("[data-count]").forEach(function(el){ animateNum(el, n(el.getAttribute("data-count"))); });
}
function stagger(){
  $$(".anim").forEach(function(el,i){ el.style.animationDelay=Math.min(i*40,320)+"ms"; });
}

function vDash(){

  var open=D.boqs.filter(function(b){return ["CONFIRMED","COMPLETED","LOST"].indexOf(b.status)<0;});

    if(["CONFIRMED","SCHEDULED","COMPLETED"].indexOf(b.status)>-1) wonVal+=t; else openVal+=t;});

  if(ME.role==="sales"){
    var mine=D.requests.filter(function(r){return r.createdBy===ME.username||ME.role==="admin";});
    h+='<div class="stats">'+
      statCard("My requests",mine.length,"")+
      statCard("Awaiting BoQ",mine.filter(function(r){return r.status==="REQUESTED";}).length,"ro")+

      ["Priced — ready for the final quote", D.boqs.filter(function(b){return b.status==="PRICED";}), "s_quotes"],

    ]);

  else if(ME.role==="support"){
    var u=unreadCount();
    h+='<div class="stats">'+
      statCard("Unread requests",u,u?"ro":"")+
      statCard("BoQ drafts",D.boqs.filter(function(b){return b.status==="DRAFT";}).length,"am")+
      statCard("Submitted",D.boqs.filter(function(b){return b.status!=="DRAFT";}).length,"cy")+
      statCard("To schedule",D.boqs.filter(function(b){return b.status==="CONFIRMED";}).length,"gr")+"</div>";
    h+=needsAttention([
      ["New requests waiting on you", D.requests.filter(function(r){return r.status==="REQUESTED";}), "sup_inbox"],
      ["Confirmed — needs scheduling", D.boqs.filter(function(b){return b.status==="CONFIRMED";}), "sup_sched"]
    ]);
  }
  else if(ME.role==="purchase"){
    h+='<div class="stats">'+
      statCard("Waiting for pricing",pendingPricing(),pendingPricing()?"ro":"")+
      statCard("Priced by me",D.purchase.filter(function(p){return p.respondedBy===ME.username;}).length,"gr")+
      statCard("Catalog items",D.catalog.length,"")+
      statCard("Items without a cost",D.catalog.filter(function(c){return !n(c.cost);}).length,"am")+"</div>";
    h+=needsAttention([["Item lists waiting for price and availability",
      D.purchase.filter(function(p){return p.status==="PENDING";}).map(function(p){var b=boqById(p.boqId)||{};return {ref:b.ref||"Draft",client:b.client,status:"PENDING",id:p.id};}),
      "pur_queue"]]);
  }
  else {
    h+='<div class="stats">'+
      statCard("Requests",D.requests.length,"")+
      statCard("Bills of quantity",D.boqs.length,"cy")+
      statCard("Quotes issued",D.quotes.filter(function(q){return q.status!=="DRAFT";}).length,"am")+
      statCard("Confirmed jobs",D.quotes.filter(function(q){return q.status==="CONFIRMED";}).length,"gr")+
      (ME.role==="admin"?statCard("Open value ("+cur()+")",openVal.toFixed(2),"cy","","m")+
        statCard("Confirmed ("+cur()+")",wonVal.toFixed(2),"gr","","m"):"")+"</div>";

function needsAttention(groups){
  var h="";
  groups.forEach(function(g){
    if(!g[1].length) return;
    h+=pnl("",esc(g[0])+' <span class="chip ro">'+g[1].length+"</span>",
      '<div class="rowlist">'+g[1].slice(0,5).map(function(x){
        return '<div class="g row" data-nav="'+g[2]+'"><div><div class="rf">'+esc(x.ref||x.reqNo||"—")+"</div>"+
          '<div class="rt">'+esc(x.client||"Untitled")+"</div>"+
          '<div class="rm"><span>'+esc(x.location||x.description||"")+"</span></div></div>"+
          '<div class="rr">'+stageChip(x.status)+"</div></div>";
      }).join("")+"</div>",
      '<button class="btn s" data-nav="'+g[2]+'">Open</button>');
  });
  if(!h) h=pnl("","Nothing needs you right now",'<p class="hint">When something moves into your part of the flow it will appear here.</p>');

function recentActivity(){
  var rows=[];
  D.requests.forEach(function(r){rows.push({at:r.createdAt,who:r.createdBy,what:"raised request "+r.reqNo,ref:r.client});});
  D.boqs.forEach(function(b){if(b.submittedAt)rows.push({at:b.submittedAt,who:b.createdBy,what:"submitted "+b.ref,ref:b.client});});
  D.quotes.forEach(function(q){if(q.sentAt)rows.push({at:q.sentAt,who:q.createdBy,what:"sent quote "+q.quoteNo,ref:q.client});
    if(q.confirmedAt)rows.push({at:q.confirmedAt,who:q.confirmedBy,what:"client confirmed "+q.quoteNo,ref:q.client});});
  rows.sort(function(a,b){return new Date(b.at)-new Date(a.at);});
  if(!rows.length) return pnl("","Recent activity",'<p class="hint">Nothing has happened yet.</p>');
  return pnl("","Recent activity",'<div class="tw"><table class="t"><tbody>'+
    rows.slice(0,12).map(function(r){
      return "<tr><td style=\"width:96px;color:var(--muted)\" class=\"mono\">"+esc(ago(r.at))+"</td>"+
        "<td><b>"+esc(r.who||"—")+"</b> "+esc(r.what)+"</td>"+
        "<td style=\"color:var(--muted)\">"+esc(r.ref||"")+"</td></tr>";
    }).join("")+"</tbody></table></div>");
}

function totalsHTML(b,items){
  var c=calc(b,items),C=cur();
  function r(l,v,cls){return '<div class="tr '+(cls||"")+'"><span>'+l+'</span><b>'+esc(C)+" "+money(v)+"</b></div>";}

  h+=r("Manpower"+(b.mpMode==="auto"?" ("+money(c.manDays)+" man-days)":""),c.manpower);
  h+=r("Subtotal",c.subtotal,"s");
  if(c.disc>0) h+='<div class="tr"><span>Less discount'+(b.discMode==="pct"?" ("+n(b.discValue)+"%)":"")+'</span><b style="color:var(--ro)">− '+esc(C)+" "+money(c.disc)+"</b></div>";
  if(c.vatOn) h+=r("VAT @ "+n(b.vatPercent)+"%",c.vat);
  h+='<div class="tr g"><span>Grand total</span><b>'+esc(C)+" "+money(c.grand)+"</b></div>";
  return h;
}
function refreshTotals(){

function itemsBlock(items,showRate){
  var cats=[],map={};
  items.forEach(function(it){var k=it.category||"Items";if(!map[k]){map[k]=[];cats.push(k);}map[k].push(it);});
  var grouped=cats.length>1,rows="",i=0;
  cats.forEach(function(k){
    if(grouped) rows+='<tr class="grp"><td colspan="6">'+esc(k)+"</td></tr>";
    map[k].forEach(function(it){
      i++;
      rows+="<tr><td class=\"c\">"+i+"</td><td><div class=\"d-mod\">"+esc(it.model||"—")+"</div>"+
        (it.description?'<div class="d-desc">'+esc(it.description)+"</div>":"")+"</td>"+
        '<td class="c">'+esc(it.unit)+'</td><td class="r">'+n(it.qty)+"</td>"+
        (showRate?'<td class="r">'+money(it.rate)+'</td><td class="r">'+money(n(it.qty)*n(it.rate))+"</td>":"")+
        "</tr>";
    });
  });
  if(!rows) rows='<tr><td colspan="6" style="text-align:center;color:#93A6B2;padding:20px">No items.</td></tr>';
  return '<table class="sh-items"><thead><tr><th style="width:30px">#</th><th>Description</th>'+
    '<th style="width:52px">Unit</th><th class="r" style="width:48px">Qty</th>'+
    (showRate?'<th class="r" style="width:84px">Rate</th><th class="r" style="width:94px">Amount</th>':"")+
    "</tr></thead><tbody>"+rows+"</tbody></table>";
}
function totBlock(c,b,C){
  return '<div class="sh-tot">'+
    '<div class="r"><span>Material &amp; equipment</span><b>'+money(c.materials)+"</b></div>"+
    (c.prof?'<div class="r"><span>Professional service charge</span><b>'+money(c.prof)+"</b></div>":"")+
    (c.manpower?'<div class="r"><span>Manpower charge</span><b>'+money(c.manpower)+"</b></div>":"")+
    '<div class="r s"><span>Subtotal</span><b>'+money(c.subtotal)+"</b></div>"+
    (c.disc?'<div class="r"><span>Less discount</span><b>− '+money(c.disc)+"</b></div>":"")+
    (c.vatOn?'<div class="r"><span>VAT @ '+n(b.vatPercent)+'%</span><b>'+money(c.vat)+"</b></div>":"")+
    '<div class="r g"><span>Grand total ('+esc(C)+')</span><b>'+money(c.grand)+"</b></div></div>"+
    '<div class="sh-words">'+esc(C)+" "+esc(words(c.grand))+"</div>";
}
function signBlock(){
  var s=D.settings;
  return '<div class="sh-sign"><div class="s"><b>'+esc((ME&&ME.fullName)||"Prepared by")+"</b>"+esc(s.companyName||"")+"</div>"+
    '<div class="s"><b>Client acceptance</b>Name, signature, company stamp &amp; date</div></div>';
}

function closeModal(){$("#modalHost").innerHTML="";}
function modal(title,body,foot,wide){
  $("#modalHost").innerHTML='<div class="scrim" data-scrim><div class="mdl'+(wide?" w":"")+'" role="dialog" aria-modal="true">'+
    '<div class="mh"><h3>'+title+'</h3><button class="btn i s" data-close>'+ic("i-x")+"</button></div>"+
    '<div class="mb">'+body+"</div>"+(foot?'<div class="mf">'+foot+"</div>":"")+"</div></div>";
}
function confirmBox(title,msg,label,fn){
  modal(esc(title),'<p style="margin:0;line-height:1.65;color:var(--ink-2)">'+esc(msg)+"</p>",
    '<button class="btn" data-close>Cancel</button><button class="btn d" id="cfm">'+esc(label)+"</button>");
  $("#cfm").onclick=function(){closeModal();fn();};
}
var pickQ="",pickC="All";
function openPicker(){
  modal("Add from price catalog",pickBody(),
    '<span class="hint" style="margin-right:auto">Tap an item to add it as a line.</span><button class="btn" data-close>Done</button>',true);
  var s=$("#pkS"); if(s){s.focus();s.oninput=function(){pickQ=s.value;$("#pkL").innerHTML=pickList();};}
  var f=$("#pkF"); if(f) f.onchange=function(){pickC=f.value;$("#pkL").innerHTML=pickList();};
}
function pickBody(){
  return '<div style="display:flex;gap:10px;margin-bottom:13px;flex-wrap:wrap">'+
    '<input class="inp" id="pkS" placeholder="Search the catalog…" value="'+esc(pickQ)+'" style="flex:1;min-width:170px">'+
    '<select class="sel" id="pkF" style="max-width:200px">'+["All"].concat(CATEGORIES).map(function(c){
      return '<option'+(c===pickC?" selected":"")+">"+esc(c)+"</option>";}).join("")+"</select></div>"+
    '<div id="pkL">'+pickList()+"</div>";
}
function pickList(){
  var q=pickQ.toLowerCase();
  var list=D.catalog.filter(function(c){
    if(pickC!=="All"&&c.category!==pickC) return false;
    if(!q) return true;
    return (c.model+" "+c.description+" "+c.brand+" "+c.category).toLowerCase().indexOf(q)>-1;
  }).slice(0,80);
  if(!list.length) return '<p class="hint" style="text-align:center;padding:26px">Nothing matches. Add it to the catalog first.</p>';
  return list.map(function(c){
    var mk=c.markup===""||c.markup==null?n(D.settings.defaultMarkup):n(c.markup);
    var sell=n(c.cost)*(1+mk/100);
    return '<div class="pickrow" data-pick="'+c.id+'"><div class="pi"><div class="pm">'+esc(c.model)+"</div>"+
      '<div class="pd">'+esc(c.category)+" · "+esc(c.description)+"</div></div>"+
      '<div class="mono" style="white-space:nowrap;font-size:13px">'+(n(c.cost)?esc(cur())+" "+money(sell):'<span class="chip am">no rate</span>')+"</div>"+
      '<button class="btn p s" data-pick="'+c.id+'">Add</button></div>';
  }).join("");
}
function openCatEditor(id){
  var it=id?D.catalog.filter(function(c){return c.id===id;})[0]:null;
  var isNew=!it;
  if(isNew) it={id:"",category:CATEGORIES[0],brand:"",model:"",description:"",unit:"Nos",cost:0,markup:""};
  modal(isNew?"Add catalog item":"Edit catalog item",

    '<div class="field" style="margin-top:15px"><label class="lbl">Model / item name</label><input class="inp" id="ceM" value="'+esc(it.model)+'"></div>'+
    '<div class="field" style="margin-top:15px"><label class="lbl">Description / specification</label><textarea class="ta" id="ceD" style="min-height:76px">'+esc(it.description)+"</textarea></div>"+
    '<div class="g3" style="margin-top:15px">'+
      fld("Unit",'<select class="sel" id="ceU">'+UNITS.map(function(u){return '<option'+(u===it.unit?" selected":"")+">"+u+"</option>";}).join("")+"</select>")+
      fld("Your cost ("+cur()+")",'<input class="inp m" id="ceCo" type="number" min="0" step="any" value="'+esc(it.cost)+'">')+
      fld("Markup %",'<input class="inp m" id="ceMk" type="number" min="0" step="any" value="'+esc(it.markup)+'" placeholder="'+esc(D.settings.defaultMarkup)+'">')+
    "</div><div class=\"hint\" style=\"margin-top:12px\">Rate used in a BoQ = cost × (1 + markup).</div>",
    '<button class="btn" data-close>Cancel</button><button class="btn p" id="ceS">'+(isNew?"Add":"Save")+"</button>");
  $("#ceS").onclick=function(){
    var m=$("#ceM").value.trim(); if(!m) return toast("Give the item a model name.","er");

      description:$("#ceD").value.trim(),unit:$("#ceU").value,cost:n($("#ceCo").value),
      markup:$("#ceMk").value.trim()===""?"":n($("#ceMk").value)};
    api("saveCatalog",{items:[rec]}).then(function(){closeModal();refresh().then(function(){renderView();toast("Catalog updated","ok");});})
      .catch(function(e){toast(e.message,"er");});

      fld("Contact person",'<div>'+esc(r.contactPerson||"—")+"</div>")+
      fld("Contact",'<div class="mono" style="font-size:13px">'+esc([r.contactPhone,r.contactEmail].filter(Boolean).join(" · ")||"—")+"</div>")+
      fld("Raised by",'<div>'+esc(r.createdBy)+" · "+esc(fmtDT(r.createdAt))+"</div>")+

function openPricing(purchaseId,readOnly){
  var p=D.purchase.filter(function(x){return x.id===purchaseId;})[0]; if(!p) return;
  var b=boqById(p.boqId)||{}, items=itemsFor(p.boqId);
  PURCH=p;
  modal("Pricing — "+esc(b.ref||"BoQ")+' <span class="chip mu" style="margin-left:8px">'+esc(b.client||"")+"</span>",
    '<div class="hint" style="margin-bottom:14px">Enter your best cost, the supplier and lead time for each line. Sales sees this the moment you submit.</div>'+
    '<div class="tw"><table class="t"><thead><tr><th>Item</th><th>Unit</th><th class="r">Qty</th>'+
    '<th style="width:110px">Best cost</th><th style="width:130px">Supplier</th><th style="width:120px">Availability</th><th style="width:90px">Lead (days)</th></tr></thead><tbody>'+
    items.map(function(it){
      return "<tr><td><b>"+esc(it.model)+"</b><div style=\"color:var(--muted);font-size:12px\">"+esc(it.description)+"</div></td>"+
        "<td class=\"mono\" style=\"font-size:12px\">"+esc(it.unit)+"</td><td class=\"r\">"+n(it.qty)+"</td>"+
        '<td><input class="inp m" type="number" min="0" step="any" data-pit="'+it.id+'" data-k="purchCost" value="'+esc(it.purchCost||"")+'"'+(readOnly?" readonly":"")+"></td>"+
        '<td><input class="inp" data-pit="'+it.id+'" data-k="purchSupplier" value="'+esc(it.purchSupplier||"")+'"'+(readOnly?" readonly":"")+"></td>"+
        '<td><select class="sel" data-pit="'+it.id+'" data-k="purchAvailability"'+(readOnly?" disabled":"")+">"+
          ["","In stock","2–3 days","1 week","2 weeks","On order","Discontinued"].map(function(o){
            return '<option'+(o===it.purchAvailability?" selected":"")+">"+esc(o)+"</option>";}).join("")+"</select></td>"+
        '<td><input class="inp m" type="number" min="0" data-pit="'+it.id+'" data-k="purchLeadDays" value="'+esc(it.purchLeadDays||"")+'"'+(readOnly?" readonly":"")+"></td></tr>";
    }).join("")+"</tbody></table></div>"+
    '<div class="field" style="margin-top:16px"><label class="lbl">Note back to sales</label>'+
    '<textarea class="ta" id="purRemark" style="min-height:76px"'+(readOnly?" readonly":"")+">"+esc(p.remark||"")+"</textarea></div>",
    readOnly?'<button class="btn" data-close>Close</button>'
      :'<button class="btn" data-close>Cancel</button><button class="btn p" id="purSubmit">'+ic("i-send")+" Send prices back to sales</button>",true);
  if(!readOnly) $("#purSubmit").onclick=function(){
    var upd=[];

      o[k]=el.value;

      .then(function(){closeModal();return refresh();})
      .then(function(){renderView();toast("Prices sent back to sales","ok");})
      .catch(function(e){toast(e.message,"er");});

}
function openQuoteBuilder(boqId){
  var b=boqById(boqId); if(!b) return;
  var items=itemsFor(boqId), c=calc(b,items), C=cur();
  var purCost=items.reduce(function(a,i){return a+n(i.purchCost)*n(i.qty);},0);
  var margin=c.materials-purCost;
  modal("Final quotation — "+esc(b.ref),
    (purCost?'<div class="g note cy" style="margin-bottom:16px"><b>Against purchase costs:</b> material sells at '+
      esc(C)+" "+money(c.materials)+", purchase quoted "+esc(C)+" "+money(purCost)+
      " — margin "+esc(C)+" "+money(margin)+" ("+(c.materials?Math.round(margin/c.materials*100):0)+"%).</div>":"")+
    '<div class="g3">'+
      fld("Validity (days)",'<input class="inp m" id="qVal" type="number" min="1" value="'+esc(D.settings.validityDays)+'">')+
      fld("Discount ("+C+")",'<input class="inp m" id="qDisc" type="number" min="0" step="any" value="'+esc(n(b.discMode==="pct"?c.disc:b.discValue))+'">')+
      fld("Apply VAT",'<select class="sel" id="qVat"><option value="1"'+(c.vatOn?" selected":"")+">Yes @ "+n(b.vatPercent)+"%</option><option value=\"0\""+(c.vatOn?"":" selected")+">No</option></select>")+
    "</div>"+
    '<div class="field" style="margin-top:15px"><label class="lbl">Remarks for the client</label>'+
    '<textarea class="ta" id="qRem" style="min-height:80px" placeholder="Anything the client should read before approving.">'+esc(b.remark||"")+"</textarea></div>"+
    '<div class="field" style="margin-top:15px"><label class="lbl">Terms &amp; conditions</label>'+
    '<textarea class="ta" id="qTerms" style="min-height:130px">'+esc(D.settings.terms||"")+"</textarea></div>"+
    '<div id="qPrev" class="g" style="margin-top:16px;border-radius:var(--r2);overflow:hidden"></div>',
    '<button class="btn" data-close>Cancel</button><button class="btn p" id="qSave">'+ic("i-doc")+" Create quotation</button>",true);
  function preview(){
    var disc=n($("#qDisc").value), vatOn=$("#qVat").value==="1";
    var sub=c.materials+c.prof+c.manpower;
    if(disc>sub) disc=sub;
    var net=sub-disc, vat=vatOn?net*n(b.vatPercent)/100:0;
    $("#qPrev").innerHTML='<div class="tr s"><span>Subtotal</span><b>'+esc(C)+" "+money(sub)+"</b></div>"+
      (disc?'<div class="tr"><span>Less discount</span><b style="color:var(--ro)">− '+esc(C)+" "+money(disc)+"</b></div>":"")+
      (vatOn?'<div class="tr"><span>VAT @ '+n(b.vatPercent)+'%</span><b>'+esc(C)+" "+money(vat)+"</b></div>":"")+
      '<div class="tr g"><span>Client pays</span><b>'+esc(C)+" "+money(net+vat)+"</b></div>";
    return {sub:sub,disc:disc,vat:vat,grand:net+vat};

var DLNS=null,DLtried=false;
function getDL(){
  if(DLtried) return Promise.resolve(DLNS);
  DLtried=true;
  try{ if(window.claude&&typeof window.claude.use==="function")
    return window.claude.use("downloads").then(function(d){DLNS=d;return d;}).catch(function(){return null;}); }catch(e){}
  return Promise.resolve(null);
}
function anchorSave(name,data,mime){
  try{
    var blob=new Blob([data],{type:mime||"text/plain;charset=utf-8"});
    var url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1500);
    return true;
  }catch(e){return false;}
}
function deliver(name,data,mime,alt){
  getDL().then(function(d){
    if(!d){ if(!anchorSave(name,data,mime)) toast("Download blocked in this view.","er"); return; }
    d.save({filename:name,data:data}).then(function(){toast("Saved · "+name,"ok");}).catch(function(err){
      var c=err&&err.code;
      if(c==="declined") return;
      if((c==="extension_not_enabled"||c==="rejected_extension")&&alt){
        var a2=name.replace(/\.[^.]+$/,"."+alt);
        return d.save({filename:a2,data:data}).then(function(){toast("Saved · "+a2,"ok");})
          .catch(function(){ if(!anchorSave(name,data,mime)) toast("Could not save here.","er"); });
      }
      if(!anchorSave(name,data,mime)) toast("Could not save: "+(err&&err.message||"unavailable"),"er");
    });
  });
}
function csvCell(v){var s=String(v==null?"":v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function toCSV(rows){return "﻿"+rows.map(function(r){return r.map(csvCell).join(",");}).join("\r\n");}
function parseCSV(t){
  t=String(t).replace(/^﻿/,"");
  var rows=[],row=[],cur="",q=false;
  for(var i=0;i<t.length;i++){
    var ch=t[i];
    if(q){ if(ch==='"'){ if(t[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else { if(ch==='"') q=true;
      else if(ch===","){row.push(cur);cur="";}
      else if(ch==="\n"){row.push(cur);cur="";rows.push(row);row=[];}
      else if(ch!=="\r") cur+=ch; }
  }
  if(cur!==""||row.length){row.push(cur);rows.push(row);}
  return rows.filter(function(r){return r.some(function(c){return String(c).trim()!=="";});});
}
function pickFile(accept,cb){
  var i=document.createElement("input");i.type="file";i.accept=accept;i.style.display="none";
  document.body.appendChild(i);
  i.addEventListener("change",function(){
    var f=i.files&&i.files[0];
    if(f){var r=new FileReader();r.onload=function(){cb(String(r.result));i.remove();};
      r.onerror=function(){toast("Could not read that file.","er");i.remove();};r.readAsText(f);}
    else i.remove();
  });
  i.click();
}

  epSave:function(){
    var v=$("#epIn").value.trim();
    if(!v) return toast("Paste the /exec URL first.","er");
    if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec/.test(v))
      return toast("That does not look like an Apps Script /exec URL.","er");
    var prev=L.endpoint; L.endpoint=v; saveLocalNow();
    api("ping",{}).then(function(){ toast("Connected to your Google Sheet","ok"); modeBadge(); renderView(); })
      .catch(function(e){ L.endpoint=prev; saveLocalNow(); modeBadge(); toast("Could not reach it: "+e.message,"er"); });
  },
  epClear:function(){L.endpoint="";saveLocalNow();modeBadge();renderView();toast("Now using this device only","ok");},
  backup:function(){ deliver("ghost-reports-backup-"+today()+".json",JSON.stringify({exportedAt:new Date().toISOString(),data:D,local:L},null,2),"application/json",null); },
  restore:function(){
    pickFile(".json,application/json",function(txt){
      try{
        var j=JSON.parse(txt); var src=j.local||j;
        if(!src||!src.boqs) throw 0;
        confirmBox("Restore this backup?","Everything held on this device is replaced by the backup contents.","Restore",function(){
          Object.keys(src).forEach(function(k){L[k]=src[k];});
          saveLocalNow(); refresh().then(function(){go("dash");toast("Restored","ok");});
        });
      }catch(e){toast("That is not a Ghost Reports backup file.","er");}
    });
  },
  wipe:function(){
    confirmBox("Erase local data?","Every request, BoQ, quote and log stored in this browser is deleted. If you are connected to a Google Sheet, that sheet is untouched.","Erase",function(){
      try{localStorage.removeItem(LKEY);}catch(e){}
      location.reload();
    });
  },
  docPrint:function(){doPrint();},
  docCsv:function(){ if(DOCB) exportBoqCSV(DOCB); },
  docBack:function(){ go(ME.role==="support"||ME.role==="admin"?"sup_boq":"s_reqs"); },
  qBack:function(){ go("s_quotes"); }
};
function importCatalog(text){
  var rows=parseCSV(text);
  if(rows.length<2) return toast("That CSV has no data rows.","er");
  var head=rows[0].map(function(h){return h.trim().toLowerCase();});
  function col(){for(var i=0;i<arguments.length;i++){var k=head.indexOf(arguments[i]);if(k>-1)return k;}return -1;}
  var ci={cat:col("category","cat"),brand:col("brand","make"),model:col("model","item"),
    desc:col("description","desc","specification"),unit:col("unit","uom"),
    cost:col("cost","price","rate","unit cost"),mk:col("markup","markup %","margin %")};
  if(ci.model<0) return toast("The CSV needs at least a “model” column.","er");
  var out=[],added=0,updated=0;
  rows.slice(1).forEach(function(r){
    var model=(r[ci.model]||"").trim(); if(!model) return;
    var found=D.catalog.filter(function(c){return String(c.model).trim().toLowerCase()===model.toLowerCase();})[0];
    var rec=found?JSON.parse(JSON.stringify(found)):{id:"",category:"Miscellaneous",brand:"",model:model,description:"",unit:"Nos",cost:0,markup:""};
    if(ci.cat>-1&&r[ci.cat]) rec.category=r[ci.cat].trim();
    if(ci.brand>-1) rec.brand=(r[ci.brand]||"").trim();
    if(ci.desc>-1&&r[ci.desc]) rec.description=r[ci.desc].trim();
    if(ci.unit>-1&&r[ci.unit]) rec.unit=r[ci.unit].trim();
    if(ci.cost>-1&&String(r[ci.cost]).trim()!=="") rec.cost=n(String(r[ci.cost]).replace(/[^0-9.\-]/g,""));
    if(ci.mk>-1&&String(r[ci.mk]).trim()!=="") rec.markup=n(String(r[ci.mk]).replace(/[^0-9.\-]/g,""));
    out.push(rec); found?updated++:added++;
  });
  api("saveCatalog",{items:out}).then(function(){return refresh();})
    .then(function(){renderView();toast(added+" added · "+updated+" updated","ok");})
    .catch(function(e){toast(e.message,"er");});
}

/* ==========================================================
   11. AUTH / BOOT
   ========================================================== */
function clientInfo(){
  var ua=navigator.userAgent||"";
  var browser=/Edg\//.test(ua)?"Edge":/OPR\//.test(ua)?"Opera":/Chrome\//.test(ua)&&!/Chromium/.test(ua)?"Chrome":
    /Firefox\//.test(ua)?"Firefox":/Safari\//.test(ua)?"Safari":"Other";
  var device=/iPhone/.test(ua)?"iPhone":/iPad/.test(ua)?"iPad":/Android/.test(ua)?"Android":
    /Windows/.test(ua)?"Windows PC":/Mac OS X/.test(ua)?"Mac":/Linux/.test(ua)?"Linux":"Unknown";
  var tz=""; try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||"";}catch(e){}
  return {device:device,browser:browser,platform:(navigator.platform||""),
    screen:(screen.width+"x"+screen.height+" @"+(window.devicePixelRatio||1)+"x"),
    timezone:tz,language:(navigator.language||""),userAgent:ua};
}
function modeBadge(){
  var d=$("#modeDot"),t=$("#modeTxt");
  if(!d||!t) return;
  if(L.endpoint){d.className="dot";t.textContent="Google Sheet connected";}
  else {d.className="dot off";t.textContent="this device only";}
}
function refresh(){
  return api("bootstrap",{}).then(function(r){
    D.settings=Object.assign({},DEFAULT_SETTINGS,r.settings||{});
    ["catalog","requests","boqs","items","purchase","quotes","activity"].forEach(function(k){
      D[k]=Array.isArray(r[k])?r[k]:[];
    });
    D.users=r.users||D.users||[];
    D.loginLog=r.loginLog||D.loginLog||[];
    D.audit=r.audit||D.audit||[];
    renderNav();
    return r;
  });
}
function signIn(username,password){
  var btn=$("#signBtn"); btn.disabled=true; btn.textContent="Signing in…";
  $("#loginErr").innerHTML="";
  api("login",{username:username,password:password,client:clientInfo()})
    .then(function(r){
      TOKEN=r.token; ME=r.user;
      return refresh();
    })
    .then(function(){
      $("#gate").style.display="none";
      $("#app").classList.add("on");
      go("dash");
      startPolling();
      toast("Signed in as "+ME.role,"ok");
    })
    .catch(function(e){
      $("#loginErr").innerHTML='<div class="gerr">'+esc(e.message)+"</div>";
    })
    .then(function(){ btn.disabled=false; btn.textContent="Sign in"; });
}
var pollT=null;
function startPolling(){
  clearInterval(pollT);
  pollT=setInterval(function(){
    if(document.hidden||!ME) return;
    if($("#modalHost").innerHTML) return;
    var beforeU=unreadCount(), beforeP=pendingPricing();
    refresh().then(function(){
      var u=unreadCount(), p=pendingPricing();
      if(ME.role==="support"&&u>beforeU) toast(u-beforeU+" new request"+(u-beforeU===1?"":"s")+" in your inbox","ok");
      if(ME.role==="purchase"&&p>beforeP) toast("New item list to price","ok");
      if(["dash","board","sup_inbox","pur_queue","s_purch","s_quotes","s_reqs","sup_sched"].indexOf(VIEW)>-1
         && !EDIT) renderView();
    }).catch(function(){});
  }, L.endpoint?20000:60000);
}
function signOut(){
  clearInterval(pollT);
  TOKEN=null; ME=null; EDIT=null; EDIT_ITEMS=[];
  $("#app").classList.remove("on");
  $("#gate").style.display="";
  $("#uIn").value=""; $("#pIn").value=""; $("#loginErr").innerHTML="";
  modeBadge();
}

document.addEventListener("click",function(e){
  var b=e.target.closest?e.target.closest("#themeBtn,#outBtn"):null;
  if(!b) return;
  if(b.id==="outBtn"){signOut();return;}
  L.theme=isDark()?"light":"dark";
  document.documentElement.setAttribute("data-theme",L.theme);
  saveLocalNow(); renderNav();
  if(window.__auroraRestart) window.__auroraRestart();
});
